name: Collect public DTEK schedule
on:
  workflow_dispatch:
  # Enable only after a successful manual run and review of site access rules.
  # schedule:
  #   - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: dtek-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Collect from official public page
        run: python scripts/collect.py
      - name: Publish validated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kyiv-region.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Kyiv region schedule"
          git push
